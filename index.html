<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudSync Dashboard</title>
  <link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/1443913936033546415/1459190989750141039/8b1a2476-0f7f-4b53-9607-670b3dbc050b.png?ex=69626102&is=69610f82&hm=def76cd6c1f581e0fafd053497311d8ad70a3962c760d4dca61f71261469110e">
  <link rel="apple-touch-icon" href="https://cdn.discordapp.com/attachments/1443913936033546415/1459190989750141039/8b1a2476-0f7f-4b53-9607-670b3dbc050b.png?ex=69626102&is=69610f82&hm=def76cd6c1f581e0fafd053497311d8ad70a3962c760d4dca61f71261469110e">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-in {
      animation: slideIn 0.3s ease-out;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const API = 'https://cloudsync-rho.vercel.app';
    const LOGO_URL = 'https://cdn.discordapp.com/attachments/1443913936033546415/1459190989750141039/8b1a2476-0f7f-4b53-9607-670b3dbc050b.png?ex=69626102&is=69610f82&hm=def76cd6c1f581e0fafd053497311d8ad70a3962c760d4dca61f71261469110e';
    
    const icons = {
      menu: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>',
      x: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>',
      key: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>',
      users: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>',
      clock: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
      activity: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>',
      trendingUp: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>',
      refresh: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>'
    };

    let state = {
      authenticated: false,
      userKey: '',
      isAdmin: false,
      sidebarOpen: false,
      currentPage: 'home',
      authInput: '',
      authError: '',
      dashboardData: {},
      loading: false,
      rendering: false
    };

    let intervalId = null;

    function setState(updates) {
      state = { ...state, ...updates };
      render();
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return num.toString();
    }

    function formatTime(seconds) {
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      if (days > 0) return `${days}d ${hours}h ${mins}m`;
      else if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
      else if (mins > 0) return `${mins}m ${secs}s`;
      else return `${secs}s`;
    }

    async function authenticate() {
      const key = state.authInput.trim();
      if (!key) {
        setState({ authError: 'Please enter a key' });
        return;
      }

      setState({ loading: true });
      try {
        const res = await fetch(`${API}/api/validate-key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await res.json();

        if (data.success) {
          setState({
            userKey: key,
            isAdmin: data.isAdmin || false,
            authenticated: true,
            authError: '',
            loading: false
          });
          sessionStorage.setItem('userKey', key);
          sessionStorage.setItem('isAdmin', data.isAdmin ? 'true' : 'false');
          startDataPolling();
        } else {
          setState({ authError: data.message || 'Invalid key or expired', loading: false });
        }
      } catch (e) {
        setState({ authError: 'Connection error. Please try again.', loading: false });
      }
    }

    async function loadData() {
      if (!state.userKey || state.rendering) return;
      try {
        const res = await fetch(`${API}/api/dashboard?key=${encodeURIComponent(state.userKey)}`);
        if (res.status === 401) {
          logout();
          return;
        }
        const data = await res.json();
        state.dashboardData = data;
        updateDashboardOnly();
      } catch (e) {}
    }

    function logout() {
      sessionStorage.clear();
      if (intervalId) clearInterval(intervalId);
      setState({
        authenticated: false,
        userKey: '',
        isAdmin: false,
        dashboardData: {}
      });
    }

    async function createKey(duration, unit) {
      try {
        const res = await fetch(`${API}/api/create-key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminKey: state.userKey, duration: parseInt(duration), unit })
        });
        const data = await res.json();
        if (data.success) {
          alert(`Key created: ${data.key}`);
          loadData();
        }
      } catch (e) {
        alert('Error creating key');
      }
    }

    async function addKeyTime(key, duration, unit) {
      try {
        await fetch(`${API}/api/add-key-time`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminKey: state.userKey, key, duration: parseInt(duration), unit })
        });
        loadData();
      } catch (e) {
        alert('Error adding time');
      }
    }

    async function rejoinPlayer(userId) {
      try {
        const res = await fetch(`${API}/api/rejoin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (data.success) {
          alert('Rejoin signal sent!');
          loadData();
        }
      } catch (e) {
        alert('Error sending rejoin signal');
      }
    }

    function startDataPolling() {
      loadData();
      intervalId = setInterval(loadData, 3000);
    }

    function init() {
      const savedKey = sessionStorage.getItem('userKey');
      const savedAdmin = sessionStorage.getItem('isAdmin') === 'true';
      if (savedKey) {
        setState({
          userKey: savedKey,
          isAdmin: savedAdmin,
          authenticated: true
        });
        startDataPolling();
      }
    }

    function LoginPage() {
      return `
        <div class="min-h-screen bg-black flex items-center justify-center p-4">
          <div class="w-full max-w-md">
            <div class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-8 shadow-2xl animate-in">
              <div class="flex justify-center mb-6">
                <img src="${LOGO_URL}" alt="CloudSync Logo" class="w-16 h-16 rounded-2xl">
              </div>
              <h1 class="text-3xl font-light text-white text-center mb-2">CloudSync</h1>
              <p class="text-gray-400 text-center text-sm mb-8">Enter your access key to continue</p>
              
              <input
                type="password"
                id="authInput"
                value="${state.authInput}"
                placeholder="CLOUDSYNC_XXXXXXXXXXXXXXXX"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-white transition-all mb-4"
              />
              
              ${state.authError ? `
                <div class="bg-red-500/10 border border-red-500/50 rounded-lg p-3 mb-4 animate-in">
                  <p class="text-red-400 text-sm text-center">${state.authError}</p>
                </div>
              ` : ''}
              
              <button
                id="authBtn"
                ${state.loading ? 'disabled' : ''}
                class="w-full bg-white text-black py-3 rounded-lg font-medium hover:bg-gray-100 transition-all active:scale-95 disabled:opacity-50"
              >
                ${state.loading ? 'Authenticating...' : 'Access Dashboard'}
              </button>
              
              <div class="mt-8 pt-6 border-t border-gray-800 text-center">
                <p class="text-gray-500 text-xs">Made by <span class="text-white font-medium">shinz</span></p>
                <p class="text-gray-600 text-xs mt-1">CloudSync © 2026</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function Dashboard() {
      const { currentPage, sidebarOpen, isAdmin, userKey } = state;
      
      return `
        <div class="min-h-screen bg-black text-white">
          <nav class="fixed top-0 left-0 right-0 h-16 bg-gray-900/80 backdrop-blur-lg border-b border-gray-800 z-50">
            <div class="h-full px-4 flex items-center justify-between">
              <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="p-2 hover:bg-gray-800 rounded-lg transition-colors">
                  ${sidebarOpen ? icons.x : icons.menu}
                </button>
                <span class="text-xl font-light tracking-tight">CloudSync</span>
              </div>
              
              <div class="flex items-center gap-3">
                <div class="px-4 py-1.5 rounded-full text-xs font-medium ${isAdmin ? 'bg-yellow-500/20 text-yellow-400' : 'bg-gray-800 text-gray-400'}">
                  ${isAdmin ? 'ADMIN' : 'USER'}
                </div>
                <button id="logoutBtn" class="px-4 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-medium hover:bg-red-500/30 transition-colors">
                  Logout
                </button>
              </div>
            </div>
          </nav>

          <aside class="fixed top-16 left-0 h-[calc(100vh-4rem)] w-64 bg-gray-900/50 backdrop-blur-lg border-r border-gray-800 transition-transform duration-300 z-40 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}">
            <nav class="p-4 space-y-2">
              <button data-page="home" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${currentPage === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:bg-gray-800'}">
                ${icons.activity}
                <span class="font-medium">Dashboard</span>
              </button>
              
              <button data-page="players" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${currentPage === 'players' ? 'bg-white text-black' : 'text-gray-400 hover:bg-gray-800'}">
                ${icons.users}
                <span class="font-medium">Players</span>
              </button>
              
              ${isAdmin ? `
                <button data-page="keys" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${currentPage === 'keys' ? 'bg-white text-black' : 'text-gray-400 hover:bg-gray-800'}">
                  ${icons.key}
                  <span class="font-medium">Keys</span>
                </button>
              ` : ''}
            </nav>
          </aside>

          <main class="pt-16 transition-all duration-300 ${sidebarOpen ? 'ml-64' : 'ml-0'}">
            <div class="p-8" id="dashboardContent">
              ${currentPage === 'home' ? renderHomePage() : ''}
              ${currentPage === 'players' ? renderPlayersPage() : ''}
              ${currentPage === 'keys' && isAdmin ? renderKeysPage() : ''}
            </div>
          </main>
        </div>
      `;
    }

    function renderHomePage() {
      const { isAdmin, dashboardData, userKey } = state;
      
      return `
        <div class="animate-in">
          <h1 class="text-4xl font-light mb-2">Dashboard</h1>
          <p class="text-gray-400 mb-8">Welcome to CloudSync Management System</p>

          ${!isAdmin ? `
            <div class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-8 mb-8 shadow-xl">
              <div class="flex items-center gap-3 mb-6">
                ${icons.key}
                <span class="text-sm text-gray-400 uppercase tracking-wider">Your Access Key</span>
              </div>
              <div class="bg-gray-900/50 rounded-lg p-4 mb-6 font-mono text-sm break-all">${userKey}</div>
              
              <div class="flex items-center justify-between mb-4">
                <span class="text-sm text-gray-400 uppercase tracking-wider">Time Remaining</span>
                ${icons.clock}
              </div>
              <div class="text-5xl font-light mb-2 ${dashboardData.keyTimeRemaining <= 0 || dashboardData.expired ? 'text-red-400' : ''}">
                ${formatTime(dashboardData.keyTimeRemaining || 0)}
              </div>
              
              ${(dashboardData.keyTimeRemaining <= 0 || dashboardData.expired) ? `
                <div class="bg-red-500/10 border border-red-500/50 rounded-lg p-4 mt-6 animate-in">
                  <p class="text-red-400 text-center font-medium">Your key has expired!</p>
                  <p class="text-red-400/70 text-center text-sm mt-1">Please contact the administrator to extend your access.</p>
                </div>
              ` : ''}
            </div>
          ` : ''}

          ${isAdmin ? `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-colors">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-sm text-gray-400 uppercase tracking-wider">Total Keys</span>
                  ${icons.key}
                </div>
                <div class="text-4xl font-light">${dashboardData.totalKeys || 0}</div>
              </div>

              <div class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-colors">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-sm text-gray-400 uppercase tracking-wider">Active Keys</span>
                  ${icons.trendingUp}
                </div>
                <div class="text-4xl font-light text-green-400">${dashboardData.activeKeys || 0}</div>
              </div>

              <div class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-colors">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-sm text-gray-400 uppercase tracking-wider">Total Players</span>
                  ${icons.users}
                </div>
                <div class="text-4xl font-light text-blue-400">${dashboardData.totalPlayers || 0}</div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderPlayersPage() {
      const { dashboardData } = state;
      const players = dashboardData.players || [];
      
      return `
        <div class="animate-in">
          <h1 class="text-4xl font-light mb-2">Players</h1>
          <p class="text-gray-400 mb-8">Manage connected players</p>

          <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            ${players.length === 0 ? `
              <div class="col-span-full text-center py-20">
                ${icons.users.replace('w-5 h-5', 'w-16 h-16')}
                <h3 class="text-xl text-gray-400 mt-4">No players connected</h3>
              </div>
            ` : players.map((player, idx) => `
              <div key="${idx}" class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-all animate-in h-fit">
                <div class="flex items-center gap-4 mb-6">
                  <div class="bg-white rounded-full w-12 h-12 flex items-center justify-center text-black font-semibold text-lg">
                    ${player.username[0].toUpperCase()}
                  </div>
                  <div class="flex-1">
                    <h3 class="font-medium">${player.username}</h3>
                    <p class="text-xs text-gray-500">ID: ${player.userId}</p>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3${player.status === 'disconnected' && player.errorMsg ? ' mb-4' : ''}">
                  <div class="bg-gray-900/50 rounded-lg p-3">
                    <div class="text-xs text-gray-400 mb-1">HONEY</div>
                    <div class="text-lg font-medium">${formatNumber(player.honey || 0)}</div>
                  </div>
                  <div class="bg-gray-900/50 rounded-lg p-3">
                    <div class="text-xs text-gray-400 mb-1">POLLEN</div>
                    <div class="text-lg font-medium">${formatNumber(player.pollen || 0)}</div>
                  </div>
                </div>

                ${player.status === 'disconnected' && player.errorMsg ? `
                  <div class="mb-4 bg-red-500/10 border border-red-500/50 rounded-lg p-3">
                    <p class="text-red-400 text-xs">${player.errorMsg}</p>
                  </div>
                  <button class="rejoin-btn w-full bg-blue-500/20 text-blue-400 py-2 rounded-lg text-sm font-medium hover:bg-blue-500/30 transition-colors flex items-center justify-center gap-2" data-userid="${player.userId}">
                    ${icons.refresh}
                    <span>Rejoin Player</span>
                  </button>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderKeysPage() {
      const { dashboardData } = state;
      const keys = dashboardData.keys || [];
      
      return `
        <div class="animate-in">
          <div class="flex items-center justify-between mb-8">
            <div>
              <h1 class="text-4xl font-light mb-2">Keys</h1>
              <p class="text-gray-400">Manage access keys</p>
            </div>
            <button id="createKeyBtn" class="bg-white text-black px-6 py-3 rounded-lg font-medium hover:bg-gray-100 transition-all active:scale-95">
              Create Key
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            ${keys.length === 0 ? `
              <div class="col-span-full text-center py-20">
                ${icons.key.replace('w-5 h-5', 'w-16 h-16')}
                <h3 class="text-xl text-gray-400 mt-4">No keys created</h3>
              </div>
            ` : keys.map((key, idx) => `
              <div key="${idx}" class="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-all animate-in">
                <div class="flex items-center justify-between mb-4">
                  <span class="px-3 py-1 rounded-full text-xs font-medium uppercase ${
                    key.status === 'active' ? 'bg-green-500/20 text-green-400' :
                    key.status === 'expired' ? 'bg-red-500/20 text-red-400' :
                    'bg-yellow-500/20 text-yellow-400'
                  }">
                    ${key.status}
                  </span>
                  ${key.status !== 'unused' ? `
                    <button class="add-time-btn text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded transition-colors" data-key="${key.key}">
                      Add Time
                    </button>
                  ` : ''}
                </div>

                <div class="bg-gray-900/50 rounded-lg p-3 mb-4 font-mono text-xs break-all">
                  ${key.key}
                </div>

                <div class="space-y-2 text-sm text-gray-400">
                  <div>Duration: ${key.duration}</div>
                  ${key.usedBy ? `<div>Used by: ${key.usedBy}</div>` : ''}
                  ${key.expiresAt ? `<div>Expires: ${new Date(key.expiresAt).toLocaleString()}</div>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function updateDashboardOnly() {
      const content = document.getElementById('dashboardContent');
      if (!content) return;
      
      const { currentPage, isAdmin } = state;
      let newHTML = '';
      
      if (currentPage === 'home') newHTML = renderHomePage();
      else if (currentPage === 'players') newHTML = renderPlayersPage();
      else if (currentPage === 'keys' && isAdmin) newHTML = renderKeysPage();
      
      content.innerHTML = newHTML;
      attachContentListeners();
    }

    function render() {
      if (state.rendering) return;
      state.rendering = true;
      
      const app = document.getElementById('app');
      app.innerHTML = state.authenticated ? Dashboard() : LoginPage();
      attachEventListeners();
      
      state.rendering = false;
    }

    function attachContentListeners() {
      const createKeyBtn = document.getElementById('createKeyBtn');
      const addTimeBtns = document.querySelectorAll('.add-time-btn');
      const rejoinBtns = document.querySelectorAll('.rejoin-btn');
      
      if (createKeyBtn) {
        createKeyBtn.addEventListener('click', () => {
          const duration = prompt('Enter duration:');
          const unit = prompt('Enter unit (minutes/hours/days):');
          if (duration && unit) createKey(duration, unit);
        });
      }
      
      addTimeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const key = e.currentTarget.dataset.key;
          const duration = prompt('Enter time to add:');
          const unit = prompt('Enter unit (minutes/hours/days):');
          if (duration && unit) addKeyTime(key, duration, unit);
        });
      });

      rejoinBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const userId = e.currentTarget.dataset.userid;
          if (confirm('Send rejoin signal to this player?')) {
            rejoinPlayer(userId);
          }
        });
      });
    }

    function attachEventListeners() {
      if (!state.authenticated) {
        const authInput = document.getElementById('authInput');
        const authBtn = document.getElementById('authBtn');
        
        if (authInput) {
          authInput.addEventListener('input', (e) => {
            state.authInput = e.target.value;
          });
          authInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') authenticate();
          });
        }
        
        if (authBtn) {
          authBtn.addEventListener('click', authenticate);
        }
      } else {
        const toggleSidebar = document.getElementById('toggleSidebar');
        const logoutBtn = document.getElementById('logoutBtn');
        const navBtns = document.querySelectorAll('.nav-btn');
        
        if (toggleSidebar) {
          toggleSidebar.addEventListener('click', () => {
            setState({ sidebarOpen: !state.sidebarOpen });
          });
        }
        
        if (logoutBtn) {
          logoutBtn.addEventListener('click', logout);
        }
        
        navBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            const page = e.currentTarget.dataset.page;
            setState({ currentPage: page });
          });
        });

        attachContentListeners();
      }
    }

    init();
    render();
  </script>
</body>
</html>
