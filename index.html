<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-box {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .auth-box h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .auth-box p {
            color: #666;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 14px;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }

        .auth-input:focus {
            border-color: #555;
        }

        .auth-error {
            color: #f00;
            font-size: 12px;
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .auth-error.show {
            opacity: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 0.6s forwards;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            font-weight: 400;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
        }

        .logout-btn:hover {
            background: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 0.6s 0.2s forwards;
        }

        .stat {
            background: #111;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #222;
            transition: all 0.3s ease;
        }

        .stat:hover {
            border-color: #333;
            transform: translateY(-2px);
        }

        .stat h2 {
            font-size: 40px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .stat p {
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 0.6s 0.4s forwards;
        }

        .section-title {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            min-height: 100px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            min-height: 100px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #333;
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            position: relative;
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #111;
        }

        .status-dot.online {
            background: #0f0;
        }

        .status-dot.offline {
            background: #f00;
        }

        .card-info h3 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .status {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details {
            margin-bottom: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
            align-items: center;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
        }

        .value {
            color: #fff;
        }

        .time-display {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .time-badge {
            background: #222;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .time-badge.expired {
            background: #f003;
            color: #f00;
        }

        .time-badge.active {
            background: #0f03;
            color: #0f0;
        }

        select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            border-color: #444;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty h3 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .empty p {
            font-size: 13px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="number"] {
            flex: 1;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 12px;
            outline: none;
            width: 60px;
        }

        input[type="number"]:focus {
            border-color: #555;
        }

        .time-unit-select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 11px;
            width: auto;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h2>Admin Authorization</h2>
            <p>Enter authorization key to access player management</p>
            <input type="password" class="auth-input" id="authInput" placeholder="Enter authorization key">
            <div class="auth-error" id="authError">Invalid authorization key</div>
            <button class="btn" onclick="authenticate()">Access Dashboard</button>
        </div>
    </div>

    <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>

    <div class="container" id="mainContent" style="display: none;">
        <div class="header">
            <h1>Player Manager</h1>
            <p>Real-time monitoring & control system</p>
        </div>

        <div class="stats">
            <div class="stat">
                <h2 id="onlineCount">0</h2>
                <p>Online</p>
            </div>
            <div class="stat">
                <h2 id="offlineCount">0</h2>
                <p>Offline</p>
            </div>
            <div class="stat">
                <h2 id="totalCount">0</h2>
                <p>Total</p>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <span class="pulse"></span>
                Players Config
            </h2>
            <div class="config-grid" id="configGrid"></div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <span class="pulse"></span>
                Live Players
            </h2>
            <div class="grid" id="onlineGrid"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Disconnected</h2>
            <div class="grid" id="offlineGrid"></div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const AUTH_KEY = 'Brandon09364168683!';
        let data = {};
        let isAuthenticated = false;
        let refreshInterval = null;
        let isUpdating = false;

        function authenticate() {
            const input = document.getElementById('authInput');
            const error = document.getElementById('authError');
            
            if (input.value === AUTH_KEY) {
                isAuthenticated = true;
                sessionStorage.setItem('auth', 'true');
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                load();
                startAutoRefresh();
            } else {
                error.classList.add('show');
                input.value = '';
                setTimeout(() => error.classList.remove('show'), 3000);
            }
        }

        function logout() {
            isAuthenticated = false;
            sessionStorage.removeItem('auth');
            stopAutoRefresh();
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('authInput').value = '';
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshInterval = setInterval(() => {
                if (!isUpdating) {
                    load();
                }
            }, 2000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function pauseRefresh(duration = 5000) {
            isUpdating = true;
            setTimeout(() => {
                isUpdating = false;
            }, duration);
        }

        document.getElementById('authInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') authenticate();
        });

        if (sessionStorage.getItem('auth') === 'true') {
            isAuthenticated = true;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            load();
            startAutoRefresh();
        }

        function formatTime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (days > 0) {
                return `${days}d ${hours}h ${mins}m`;
            } else if (hours > 0) {
                return `${hours}h ${mins}m ${secs}s`;
            } else {
                return `${mins}m ${secs}s`;
            }
        }

        async function load() {
            if (!isAuthenticated) return;
            
            try {
                const res = await fetch(`${API}/api/players`, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                const json = await res.json();
                data = json.players || {};
                render();
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        function render() {
            const all = Object.entries(data);
            const online = all.filter(([_, p]) => p.status === 'online');
            const offline = all.filter(([_, p]) => p.status === 'disconnected');

            document.getElementById('onlineCount').textContent = online.length;
            document.getElementById('offlineCount').textContent = offline.length;
            document.getElementById('totalCount').textContent = all.length;

            renderConfigGrid(all);
            renderGrid('onlineGrid', online, 'online');
            renderGrid('offlineGrid', offline, 'offline');
        }

        function renderConfigGrid(arr) {
            const grid = document.getElementById('configGrid');
            
            if (arr.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <h3>No players</h3>
                        <p>Waiting for players to execute the script</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = arr.sort((a, b) => b[1].firstSeen - a[1].firstSeen).map(([userId, p]) => {
                const timeRemaining = p.timeRemaining || 0;
                const hasTime = timeRemaining > 0;
                const timeClass = hasTime ? 'active' : 'expired';
                const statusDot = p.status === 'online' ? 'online' : 'offline';
                
                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="avatar">
                                ${p.username[0].toUpperCase()}
                                <div class="status-dot ${statusDot}"></div>
                            </div>
                            <div class="card-info">
                                <h3>${p.username}</h3>
                                <div class="status">${p.status}</div>
                            </div>
                        </div>
                        <div class="details">
                            <div class="detail">
                                <span class="label">User ID</span>
                                <span class="value">${userId}</span>
                            </div>
                            <div class="detail">
                                <span class="label">Time</span>
                                <div class="time-display">
                                    <span class="time-badge ${timeClass}">${formatTime(timeRemaining)}</span>
                                    <div class="input-group">
                                        <input type="number" id="time-${userId}" placeholder="10" min="1" value="10">
                                        <select class="time-unit-select" id="unit-${userId}">
                                            <option value="minutes">Min</option>
                                            <option value="hours">Hours</option>
                                            <option value="days">Days</option>
                                        </select>
                                        <button class="btn btn-small" onclick="addTime('${userId}')">Add</button>
                                    </div>
                                </div>
                            </div>
                            <div class="detail">
                                <span class="label">Script</span>
                                <select id="script-${userId}" onchange="updateScript('${userId}')">
                                    <option value="none" ${p.selectedScript === 'none' ? 'selected' : ''}>None</option>
                                    <option value="atlas" ${p.selectedScript === 'atlas' ? 'selected' : ''}>Atlas BSS</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderGrid(id, arr, type) {
            const grid = document.getElementById(id);
            
            if (arr.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <h3>No ${type} players</h3>
                        <p>${type === 'online' ? 'Waiting for connections' : 'No disconnections'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = arr.map(([userId, p]) => {
                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="avatar">
                                ${p.username[0].toUpperCase()}
                                <div class="status-dot ${type}"></div>
                            </div>
                            <div class="card-info">
                                <h3>${p.username}</h3>
                                <div class="status">${p.shouldRejoin ? 'Rejoin sent' : type}</div>
                            </div>
                        </div>
                        <div class="details">
                            <div class="detail">
                                <span class="label">User ID</span>
                                <span class="value">${userId}</span>
                            </div>
                            ${p.errorMsg ? `
                            <div class="detail">
                                <span class="label">Error</span>
                                <span class="value">${p.errorMsg}</span>
                            </div>
                            ` : ''}
                        </div>
                        ${type === 'offline' ? `
                        <button class="btn" onclick="rejoin('${userId}')" ${p.shouldRejoin ? 'disabled' : ''}>
                            ${p.shouldRejoin ? 'Rejoin sent' : 'Rejoin'}
                        </button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function addTime(userId) {
            pauseRefresh();
            
            const input = document.getElementById(`time-${userId}`);
            const unitSelect = document.getElementById(`unit-${userId}`);
            const amount = parseInt(input.value) || 0;
            const unit = unitSelect.value;
            
            if (amount <= 0) {
                alert('Please enter a valid number');
                return;
            }
            
            let seconds = amount * 60;
            if (unit === 'hours') {
                seconds = amount * 3600;
            } else if (unit === 'days') {
                seconds = amount * 86400;
            }
            
            try {
                const res = await fetch(`${API}/api/update-time`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId, 
                        timeToAdd: seconds
                    })
                });
                const json = await res.json();
                if (json.success) {
                    input.value = '10';
                    unitSelect.value = 'minutes';
                    await load();
                }
            } catch (e) {
                console.error('Add time error:', e);
            }
        }

        async function updateScript(userId) {
            pauseRefresh();
            
            const select = document.getElementById(`script-${userId}`);
            const script = select.value;
            
            try {
                const res = await fetch(`${API}/api/update-script`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, script })
                });
                const json = await res.json();
                if (json.success) {
                    await load();
                }
            } catch (e) {
                console.error('Update script error:', e);
            }
        }

        async function rejoin(userId) {
            pauseRefresh();
            
            try {
                const res = await fetch(`${API}/api/rejoin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const json = await res.json();
                if (json.success) {
                    await load();
                }
            } catch (e) {
                console.error('Rejoin error:', e);
            }
        }
    </script>
</body>
</html>
