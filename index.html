<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 0.6s forwards;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            font-weight: 400;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 0.6s 0.2s forwards;
        }

        .stat {
            background: #111;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #222;
            transition: all 0.3s ease;
        }

        .stat:hover {
            border-color: #333;
            transform: translateY(-2px);
        }

        .stat h2 {
            font-size: 40px;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .stat p {
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 0.6s 0.4s forwards;
        }

        .section-title {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: slideUp 0.5s forwards;
        }

        .card:hover {
            border-color: #333;
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            position: relative;
        }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #111;
        }

        .status-dot.online {
            background: #fff;
        }

        .status-dot.offline {
            background: #333;
        }

        .card-info h3 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .status {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details {
            margin-bottom: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
        }

        .value {
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover:not(:disabled) {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty h3 {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .empty p {
            font-size: 13px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            transform: translateY(20px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Player Manager</h1>
            <p>Real-time monitoring system</p>
        </div>

        <div class="stats">
            <div class="stat">
                <h2 id="onlineCount">0</h2>
                <p>Online</p>
            </div>
            <div class="stat">
                <h2 id="offlineCount">0</h2>
                <p>Offline</p>
            </div>
            <div class="stat">
                <h2 id="totalCount">0</h2>
                <p>Total</p>
            </div>
            <div class="stat">
                <h2 id="rejoinCount">0</h2>
                <p>Rejoins</p>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <span class="pulse"></span>
                Live Players
            </h2>
            <div class="grid" id="onlineGrid"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Disconnected</h2>
            <div class="grid" id="offlineGrid"></div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let data = {};
        let playerStartTimes = {};

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function load() {
            try {
                const res = await fetch(`${API}/api/players`);
                const json = await res.json();
                const newData = json.players || {};
                
                Object.keys(playerStartTimes).forEach(userId => {
                    if (!newData[userId] || newData[userId].status !== 'online') {
                        delete playerStartTimes[userId];
                    }
                });
                
                Object.keys(newData).forEach(userId => {
                    const player = newData[userId];
                    
                    if (player.status === 'online' && !playerStartTimes[userId]) {
                        playerStartTimes[userId] = Date.now();
                    }
                });
                
                data = newData;
                render();
            } catch (e) {}
        }

        function render() {
            const all = Object.entries(data);
            const online = all.filter(([_, p]) => p.status === 'online');
            const offline = all.filter(([_, p]) => p.status === 'disconnected');

            document.getElementById('onlineCount').textContent = online.length;
            document.getElementById('offlineCount').textContent = offline.length;
            document.getElementById('totalCount').textContent = all.length;
            document.getElementById('rejoinCount').textContent = offline.filter(([_, p]) => p.shouldRejoin).length;

            renderGrid('onlineGrid', online, 'online');
            renderGrid('offlineGrid', offline, 'offline');
        }

        function renderGrid(id, arr, type) {
            const grid = document.getElementById(id);
            
            if (arr.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <h3>No ${type} players</h3>
                        <p>${type === 'online' ? 'Waiting for connections' : 'No disconnections'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = arr.map(([userId, p]) => {
                let timeValue = '0:00';
                
                if (type === 'online' && playerStartTimes[userId]) {
                    const elapsed = Math.floor((Date.now() - playerStartTimes[userId]) / 1000);
                    timeValue = formatTime(elapsed);
                }
                
                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="avatar">
                                ${p.username[0].toUpperCase()}
                                <div class="status-dot ${type}"></div>
                            </div>
                            <div class="card-info">
                                <h3>${p.username}</h3>
                                <div class="status">${p.shouldRejoin ? 'Rejoin sent' : type}</div>
                            </div>
                        </div>
                        <div class="details">
                            <div class="detail">
                                <span class="label">User ID</span>
                                <span class="value">${userId}</span>
                            </div>
                            ${p.errorMsg ? `
                            <div class="detail">
                                <span class="label">Error</span>
                                <span class="value">${p.errorMsg}</span>
                            </div>
                            ` : ''}
                            <div class="detail">
                                <span class="label">Time</span>
                                <span class="value" id="timer-${userId}">${timeValue}</span>
                            </div>
                        </div>
                        ${type === 'offline' ? `
                        <button class="btn" onclick="rejoin('${userId}')" ${p.shouldRejoin ? 'disabled' : ''}>
                            ${p.shouldRejoin ? 'Rejoin sent' : 'Rejoin'}
                        </button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        async function rejoin(userId) {
            try {
                const res = await fetch(`${API}/api/rejoin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const json = await res.json();
                if (json.success) {
                    data[userId].shouldRejoin = true;
                    render();
                }
            } catch (e) {}
        }

        setInterval(() => {
            Object.keys(playerStartTimes).forEach(userId => {
                const timerEl = document.getElementById(`timer-${userId}`);
                if (timerEl && data[userId] && data[userId].status === 'online') {
                    const elapsed = Math.floor((Date.now() - playerStartTimes[userId]) / 1000);
                    timerEl.textContent = formatTime(elapsed);
                }
            });
        }, 1000);

        load();
        setInterval(load, 2000);
    </script>
</body>
</html>
